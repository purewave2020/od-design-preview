<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lumen · Onboarding</title>
<style>
  :root { --ink: #121018; --muted: #6b6679; --accent: #5b3df5; --hot: #ff6a88; --paper: #fbfaf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
  .screen { min-height: 100vh; display: flex; flex-direction: column; padding: 56px 24px 32px; max-width: 520px; margin: 0 auto; }
  .status { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin: -40px 0 28px; }
  .art { position: relative; height: 300px; border-radius: 32px; overflow: hidden;
    background: radial-gradient(80% 80% at 30% 20%, #cbbfff 0%, transparent 60%), radial-gradient(70% 70% at 80% 80%, #ffc4d0 0%, transparent 60%), #efeaff; }
  .bubble { position: absolute; padding: 10px 14px; border-radius: 16px; background: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 14px 30px -16px rgba(40, 20, 120, .45); }
  .b1 { top: 40px; left: 22px; } .b2 { top: 128px; right: 20px; } .b3 { bottom: 34px; left: 48px; }
  .b2::before { content: "↳ "; color: var(--accent); }
  h1 { font-size: 32px; line-height: 1.1; letter-spacing: -.03em; margin: 32px 0 10px; }
  p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
  .dots { display: flex; gap: 6px; margin: 28px 0; }
  .dots span { width: 8px; height: 8px; border-radius: 99px; background: #ddd6ee; }
  .dots span.on { width: 24px; background: var(--accent); }
  .actions { margin-top: auto; display: grid; gap: 10px; }
  button { height: 54px; border-radius: 18px; border: none; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  .primary { background: var(--ink); color: #fff; }
  .secondary { background: transparent; color: var(--ink); }
</style>
</head>
<body>
  <main class="screen">
    <div class="status"><span>9:41</span><span>●●● ◔</span></div>
    <div class="art" aria-hidden="true">
      <div class="bubble b1">Q3 launch plan</div>
      <div class="bubble b2">Pricing notes</div>
      <div class="bubble b3">Interview — Maya</div>
    </div>
    <h1>Your notes, already connected.</h1>
    <p>Lumen links related ideas as you write, so nothing you capture gets lost.</p>
    <div class="dots"><span class="on"></span><span></span><span></span></div>
    <div class="actions">
      <button class="primary" type="button" onclick="this.textContent='Welcome aboard ✦'">Get started</button>
      <button class="secondary" type="button">I already have an account</button>
    </div>
  </main>
</body>
</html>
